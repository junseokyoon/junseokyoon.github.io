# 1. wiki-build.yml 수정
on:
  push:
    branches: [ master ]  # main → master
  pull_request:
    branches: [ master ]  # main → master

# 2. Node.js 단계 추가 (Jekyll 빌드 전)
- name: Setup Node.js
  uses: actions/setup-node@v3
  with:
    node-version: '16'

- name: Install dependencies
  run: npm install

- name: Generate metadata
  run: node generateData.js
