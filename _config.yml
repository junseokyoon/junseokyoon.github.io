# 기존 설정 (수정하지 마세요)
title: Your awesome title
email: your-email@example.com
description: >-
  Write an awesome description for your new site here.
baseurl: ""
url: "https://junseokyoon.github.io"
theme: minima
plugins:
  - jekyll-feed

# ============================================
# 위키 설정 추가 (여기부터 추가하세요)
# ============================================

# 위키 컬렉션 설정
collections:
  wiki:
    output: true
    permalink: /wiki/:path/

# 위키 기본값 설정
defaults:
  - scope:
      path: ""
      type: wiki
    values:
      layout: wiki
      type: wiki
      comment: true

# 마크다운 처리 설정
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# 제외할 파일들
exclude:
  - scripts/
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .github
